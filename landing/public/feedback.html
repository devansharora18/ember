<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback — Ember</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 720px; margin: 0 auto; padding: 40px 20px; color: #222; line-height: 1.7; }
  h1 { font-size: 28px; margin-bottom: 4px; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 32px; }
  h2 { font-size: 18px; margin-top: 32px; }
  p { font-size: 15px; color: #444; }
  a { color: #ea580c; text-decoration: underline; }
  a:hover { opacity: 0.8; }
  .card { background: #f9f9f9; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
  .card h3 { margin: 0 0 8px; font-size: 16px; }
  .card p { margin: 0; font-size: 14px; color: #666; }
  .card a { font-weight: 500; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #333; }
  .form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #d4d4d4; border-radius: 8px; font-size: 14px; font-family: inherit; box-sizing: border-box; }
  .form-group textarea { min-height: 120px; resize: vertical; }
  button { background: #ea580c; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #d64d08; }
  input:focus, textarea:focus { outline: none; border-color: #ea580c; }
</style>
</head>
<body>

<h1>Feedback</h1>
<p class="subtitle">Help improve Ember — we'd love to hear from you.</p>

<form action="https://formsubmit.co/mail@devansharora.in" method="POST">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_template" value="box">

  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Your name" required>
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="your@email.com" required>
  </div>

  <div class="form-group">
    <label for="message">Message</label>
    <textarea id="message" name="message" placeholder="Bug reports, feature requests, or anything else..." required></textarea>
  </div>

  <button type="submit">Send Feedback</button>
</form>

<div class="card" style="margin-top: 32px;">
  <h3>Other ways to reach us</h3>
  <p><a href="https://groups.google.com/g/ember-closed-testing" target="_blank" rel="noopener noreferrer">Google Group</a> &middot; <a href="https://github.com/devansharora18/ember/issues" target="_blank" rel="noopener noreferrer">GitHub Issues</a> &middot; <a href="mailto:mail@devansharora.in">Email</a></p>
</div>

<p style="margin-top: 40px; font-size: 13px; color: #999;">
  <a href="/ember/">&larr; Back to Ember</a>
</p>

</body>
</html>
