# Ember — contents tile.
# Raw: the chapter list (table of contents) for an open book.
#
# Precondition: the four .epub files from goldie/setup-device.sh are in
# /sdcard/Download on the booted Pixel 9 Pro AVD. goldie clears the app's data
# before this flow, so the import is part of the flow.
#
# The TOC button is an unlabelled Flutter icon with no accessibility tree on
# the reader screen, and the reader auto-hides its controls after 3 seconds, so
# both taps here are raw `gesture-tap` tool calls rather than `tap` directives
# (see store-02-rsvp for the full reasoning).

steps:
  - launch: in.devansharora.ember
  - await: { visible: { text: Library }, timeout: 20000 }
  - await: { idle: true }

  # ── import the four books through the system file picker ──
  - echo: Tap the + FAB (unlabelled) to open the system picker.
  - tap: { x: 0.897, y: 0.929 }
  - await: { visible: { text: Show roots } }
  - echo: Show roots, then Downloads.
  - tap: { x: 0.066, y: 0.080 }
  - await: { visible: { text: Downloads } }
  - tap: { x: 0.234, y: 0.261 }
  - await: { visible: { text: 'dune.epub' } }
  - echo: Open the overflow menu.
  - tap: { x: 0.944, y: 0.080 }
  - wait: 1200
  - echo: Select all (popup item, coordinate only).
  - tap: { x: 0.761, y: 0.180 }
  - wait: 1200
  - echo: Confirm the selection.
  - wait: 1200
  - tap: { x: 0.813, y: 0.080 }
  - wait: 25000
  - await: { idle: true }

  # ── open the first book, then its table of contents ──
  - echo: Open the top-left card.
  - tap: { x: 0.260, y: 0.329 }
  - wait: 14000
  # Let the controls finish auto-hiding so the next tap shows them.
  - wait: 4000
  - echo: Show the controls.
  - tool: gesture-tap
    args: { x: 0.500, y: 0.500 }
  - wait: 700
  - echo: Open the chapter list (unlabelled app bar icon).
  - tool: gesture-tap
    args: { x: 0.822, y: 0.077 }
  - wait: 1500
  - await: { idle: true }
